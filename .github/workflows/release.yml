# On a version tag (v0.3.0), builds the plugin with fsm-editor-common's sidecar of
# every platform, attaches it to the GitHub Release of that tag, and publishes it
# to the JetBrains Marketplace when the JETBRAINS_MARKETPLACE_TOKEN secret is set
# (a token from plugins.jetbrains.com > My Tokens).
name: Release

on:
  push:
    tags: ['v*']

env:
  # Release of fsm-editor-common (github.com/vincedupuis/fsm-editor-common) whose sidecar (the
  # fsm-editor-common-<version>-<platform> archives), templates and schemas archives the plugin bundles, and whose
  # api-cases archive the tests replay.
  FSM_COMMON_VERSION: 0.1.2

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the plugin version
        run: |
          version=$(sed -nE 's/^version *= *//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the plugin version $version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # `basic`: the MIT-licensed cache. The default (`enhanced`) since v6 is a
      # proprietary component under Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Fetch fsm-editor-common, fsm-cli's templates, the schemas and the interface's cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$FSM_COMMON_VERSION
          gh release download "v$v" -R vincedupuis/fsm-editor-common -p "fsm-editor-common-*" -D "$RUNNER_TEMP/common"
          for archive in "$RUNNER_TEMP"/common/*; do
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$RUNNER_TEMP/common" ;;
              *.tar.gz) tar xzf "$archive" -C "$RUNNER_TEMP/common" ;;
            esac
          done
          # The sidecar per platform, then the templates, the schemas (bundled) and the interface's cases (tests only).
          scripts/fetch-common.sh "$RUNNER_TEMP/common"
          ls -R plugin/cli

      - name: Test
        run: ./gradlew :core:test :plugin:test

      - name: Build the plugin
        run: ./gradlew :plugin:buildPlugin :plugin:verifyPlugin

      - name: Attach the plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          zip="plugin/build/distributions/fsm-editor-$version.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "FSM Editor for JetBrains IDEs $version" --generate-notes
          fi

      - name: Publish to the JetBrains Marketplace
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        run: ./gradlew :plugin:publishPlugin
