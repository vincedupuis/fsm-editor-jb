group = com.vincegosoftware.fsmeditor
version = 0.8.2

# Oldest IDE the plugin supports (2024.3), also the one it compiles against.
platformVersion = 2024.3.6
# Newest IDE release, which CI tests (-PplatformVersion=$newestPlatformVersion).
newestPlatformVersion = 2026.3
# The IDEs CI verifies the plugin against besides platformVersion (-PverifyAll): IDEs without Java at the oldest
# version (type:version). Not the newest: the Plugin Verifier (1.411) doesn't resolve 2026.3's XML module alias
# (com.intellij.modules.xml), which those IDEs bundle; CI runs the headless IDE tests on newestPlatformVersion instead.
verifyIdes = PyCharmProfessional:2024.3.6 CLion:2024.3.6 Rider:2024.3.10 WebStorm:2024.3.6
pluginSinceBuild = 243

org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
